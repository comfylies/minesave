# ============================================================
# COS Profile — 激活方式: --spring.profiles.active=cos
# 腾讯云 COS S3 兼容端点（生产环境）
# 密钥通过环境变量注入，不要硬编码！
# ============================================================
app:
  storage:
    type: s3
    s3:
      endpoint: https://cos.${COS_REGION:ap-guangzhou}.myqcloud.com
      region: ${COS_REGION:ap-guangzhou}
      access-key: ${COS_SECRET_ID}
      secret-key: ${COS_SECRET_KEY}
      bucket-name: ${COS_BUCKET_NAME:gamesaving}
      path-style-access: false
      presigned-url-expiration-minutes: 5
