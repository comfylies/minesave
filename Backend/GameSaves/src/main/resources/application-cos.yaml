# ============================================================
# Profile: cos — 腾讯云 COS 对象存储（生产环境）
# 启动: ./mvnw spring-boot:run -Dspring-boot.run.profiles=cos
# IDEA: 选择 "GameSaves [cos]" 运行配置
# 依赖: COS 凭证配置（通过环境变量或启动参数注入）
# ============================================================
app:
  storage:
    type: s3
    s3:
      endpoint: https://cos.ap-shanghai.myqcloud.com
      region: ap-shanghai
      access-key: ${COS_ACCESS_KEY:}
      secret-key: ${COS_SECRET_KEY:}
      bucket-name: gamesaving-${COS_APPID:}
      path-style-access: false
      presigned-url-expiration-minutes: 15
      public-url-expiration-minutes: 10080
  extraction:
    admin:
      max-file-size: 1073741824              # 1 GB（管理员上传文件大小上限）
      max-total-uncompressed-size: 1610612736 # 1.5 GB（管理员总解压后大小上限）
  download:
    captcha-threshold: 524288000             # 500 MB — 超过此大小的下载需要验证码
    max-large-downloads-per-day: 3           # 每人（IP）每日大文件下载次数上限
  edit:
    max-daily-edits: 2
