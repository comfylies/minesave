# ============================================================
# COS Profile — 激活方式: --spring.profiles.active=cos
# 或设置环境变量: APP_STORAGE_TYPE=cos
# ============================================================
app:
  storage:
    type: cos
    cos:
      # 通过环境变量注入（不要硬编码密钥！）
      secret-id: ${COS_SECRET_ID}
      secret-key: ${COS_SECRET_KEY}
      region: ap-guangzhou
      bucket-name: ${COS_BUCKET_NAME:gamesaving}
      presigned-url-expiration-minutes: 5
