# ============================================================
# Profile: cos — 腾讯云 COS 对象存储（生产环境）
# 启动: ./mvnw spring-boot:run -Dspring-boot.run.profiles=cos
# IDEA: 选择 "GameSaves [cos]" 运行配置
# 依赖: COS 凭证配置（通过环境变量或启动参数注入）
# ============================================================
app:
  storage:
    type: s3
    s3:
      endpoint: https://cos.ap-shanghai.myqcloud.com
      region: ap-shanghai
      access-key: ${COS_ACCESS_KEY:}
      secret-key: ${COS_SECRET_KEY:}
      bucket-name: gamesaving-${COS_APPID:1234567890}
      path-style-access: false
      presigned-url-expiration-minutes: 15
