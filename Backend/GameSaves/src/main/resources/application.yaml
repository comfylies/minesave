# ============================================================
# GameSaving — 公共配置（所有模式共享）
# ============================================================
spring:
  application:
    name: GameSaves
  profiles:
    active: local    # 默认本地存储；minio / cos 通过 VM option 覆盖

  # ── MySQL 8.0 数据库 ──
  datasource:
    url: jdbc:mysql://localhost:3306/gamesaving?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 3256
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # ── JPA ──
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ── 文件上传 ──
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

  # ── QQ 邮箱 ──
  mail:
    host: smtp.qq.com
    port: 587
    username: 1834909995@qq.com
    password: scegopvlbiqobfej
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false

# ── 服务器端口 ──
server:
  port: 8080

# ── Sa-Token 权限认证（JWT 模式）──
# JWT 模式：token 自包含登录信息，服务端无状态，重启不丢会话。
# timeout 控制 JWT 过期时间（exp），无 active-timeout（JWT 签发后无法服务端刷新）。
sa-token:
  token-name: Authorization
  timeout: 604800           # 7 天 JWT 过期（无 idle timeout，用更长硬过期补偿）
  is-jwt: true              # 显式开启 JWT 模式（配合 sa-token-jwt 插件）
  is-concurrent: false
  is-share: false
  is-log: true
  is-print: false
  jwt-secret-key: gs_jwt_hs256_key_2026_do_not_leak_change_in_production

# ── Meilisearch 搜索引擎 ──
meilisearch:
  host: http://localhost:7700
  api-key: gamesaving-master-key-2026

# ── 应用自定义配置（公共部分）──
app:
  rate-limit:
    max-downloads-per-ip: 3
    window-seconds: 60
  extraction:
    max-file-size: 524288000                 # 500 MB（普通用户上传文件大小上限）
    max-entry-size: 104857600                # 100 MB（单条目解压后上限）
    max-total-uncompressed-size: 524288000   # 500 MB（普通用户总解压后大小上限）
    max-entry-count: 10000                   # 最大条目数
    admin:
      max-file-size: 1073741824              # 1 GB（管理员上传文件大小上限）
      max-total-uncompressed-size: 1610612736 # 1.5 GB（管理员总解压后大小上限）
  download:
    captcha-threshold: 524288000             # 500 MB — 超过此大小的下载需要验证码
    max-large-downloads-per-day: 3           # 每人（IP）每日大文件下载次数上限
  login:
    max-fail-count: 5
    lock-minutes: 30
    email-code-cooldown: 90
    email-code-ttl: 600
  security:
    magic-number:
      enabled: true
      rules:
        MZ: exe,dll,sys,ocx,drv,cpl,scr,msi
        ELF: so,o,ko,elf,bin,out
        SHEBANG: sh,bash,zsh,py,rb,pl,php,js,lua
  cors:
    allowed-origins: "*"
  preview:
    max-size-bytes: 5242880                  # 5 MB
    allowed-extensions: txt,md,json,xml,yml,yaml,log,csv,ini,cfg,conf,properties,html,css,js,ts,java,py,sh,bat,sql,nbt,mcmeta,mf,lang,info,lock,ojng
  cleanup:
    interval-ms: 10800000                    # 3 小时
    retention-hours: 3
    batch-size: 50
    batch-delay-ms: 2000
    delete-physical-files: true
  edit:
    max-daily-edits: 999999
