# ============================================================
# Profile: prod — 腾讯云 COS 对象存储（生产环境）
# 启动: ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
# 环境变量: COS_SECRET_ID, COS_SECRET_KEY, COS_APPID, DB_PASSWORD,
#           JWT_SECRET_KEY, MEILISEARCH_API_KEY, MAIL_USERNAME, MAIL_PASSWORD
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gamesaving?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: gamesaving
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8080

sa-token:
  token-name: Authorization
  timeout: 604800           # 7 天 JWT 过期
  is-jwt: true
  is-concurrent: false
  is-share: false
  is-log: false
  is-print: false
  jwt-secret-key: ${JWT_SECRET_KEY}

meilisearch:
  host: http://127.0.0.1:7700
  api-key: ${MEILISEARCH_API_KEY}

app:
  storage:
    type: s3
    database-path: /opt/gamesaving/storage
    s3:
      endpoint: https://cos.ap-shanghai.myqcloud.com
      region: ap-shanghai
      access-key: ${COS_SECRET_ID}
      secret-key: ${COS_SECRET_KEY}
      bucket-name: gamesaving-${COS_APPID}
      path-style-access: false
      presigned-url-expiration-minutes: 5
      public-url-expiration-minutes: 10080   # 7 天，匹配 JWT token 有效期
  rate-limit:
    max-downloads-per-ip: 10
    window-seconds: 60
  extraction:
    timeout-seconds: 30
    max-file-size: 524288000                 # 500 MB（普通用户）
    max-total-uncompressed-size: 524288000   # 500 MB（普通用户）
    admin:
      max-file-size: 1073741824              # 1 GB（管理员）
      max-total-uncompressed-size: 1610612736 # 1.5 GB（管理员）
  download:
    captcha-threshold: 524288000
    max-large-downloads-per-day: 3
  login:
    captcha-required: true
    max-fail-count: 5
    lock-minutes: 30
    email-code-cooldown: 90
    email-code-ttl: 600
  security:
    magic-number:
      enabled: true
      rules:
        MZ: exe,dll,sys,ocx,drv,cpl,scr,msi
        ELF: so,o,ko,elf,bin,out
        SHEBANG: sh,bash,zsh,py,rb,pl,php,js,lua
  cleanup:
    interval-ms: 10800000
    retention-hours: 3
    batch-size: 50
    batch-delay-ms: 2000
    delete-physical-files: true
