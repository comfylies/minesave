# ============================================================
# Profile: minio — MinIO S3 兼容存储（本地测试 COS，需 MinIO 服务）
# 启动: ./mvnw spring-boot:run -Dspring-boot.run.profiles=minio
# IDEA: 选择 "GameSaves [minio]" 运行配置
# 依赖: MinIO 服务运行在 192.168.100.2:9000
# ============================================================
app:
  storage:
    type: s3
    s3:
      endpoint: http://192.168.100.2:9000
      region: us-east-1
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin123}
      bucket-name: gamesaving
      path-style-access: true
      presigned-url-expiration-minutes: 5
      public-url-expiration-minutes: 10080
  extraction:
    admin:
      max-file-size: 1073741824              # 1 GB（管理员上传文件大小上限）
      max-total-uncompressed-size: 1610612736 # 1.5 GB（管理员总解压后大小上限）
  download:
    captcha-threshold: 524288000             # 500 MB — 超过此大小的下载需要验证码
    max-large-downloads-per-day: 3           # 每人（IP）每日大文件下载次数上限
